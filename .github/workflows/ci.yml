name: CI

on:
  push:
    branches: [main, "fable5/**"]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore (libraries and tests)
        run: |
          dotnet restore src/PrayerApp.Core/PrayerApp.Core.csproj
          dotnet restore src/PrayerApp.Infrastructure/PrayerApp.Infrastructure.csproj
          dotnet restore tests/PrayerApp.UnitTests/PrayerApp.UnitTests.csproj
          dotnet restore tests/PrayerApp.IntegrationTests/PrayerApp.IntegrationTests.csproj

      - name: Format check (Core & Infrastructure)
        run: |
          dotnet format src/PrayerApp.Core/PrayerApp.Core.csproj --verify-no-changes --no-restore || echo "::warning::Formatting differences found in Core"
          dotnet format src/PrayerApp.Infrastructure/PrayerApp.Infrastructure.csproj --verify-no-changes --no-restore || echo "::warning::Formatting differences found in Infrastructure"

      - name: Unit tests
        run: dotnet test tests/PrayerApp.UnitTests/PrayerApp.UnitTests.csproj -c Release --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Integration tests
        run: dotnet test tests/PrayerApp.IntegrationTests/PrayerApp.IntegrationTests.csproj -c Release --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  android-build:
    name: Android Build
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore PrayerApp.csproj

      - name: Android Debug build
        run: dotnet build PrayerApp.csproj -f net10.0-android -c Debug -p:EmbedAssembliesIntoApk=true

      - name: Android Release build (unsigned AAB)
        run: dotnet publish PrayerApp.csproj -f net10.0-android -c Release -p:AndroidPackageFormats=aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-unsigned
          path: bin/Release/net10.0-android/publish/*.aab

  # Release signing (manuel tetiklenen ayrı job — GitHub Secrets gerektirir):
  #   ANDROID_KEYSTORE_BASE64  : keystore dosyasının base64'ü
  #   ANDROID_KEYSTORE_PASS    : keystore parolası
  #   ANDROID_KEY_ALIAS        : anahtar alias'ı
  #   ANDROID_KEY_PASS         : anahtar parolası
  # Kullanım örneği docs/RELEASE_GUIDE.md içindedir.
